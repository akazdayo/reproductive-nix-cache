[package]
name = "reproductive-nix-cache"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.32"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version="0.7.18", features = ["codec"] }
thiserror = "2.0.18"
regex = "1.12.4"
